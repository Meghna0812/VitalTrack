# Render "Blueprint": describes the infrastructure as code. In Render, choose
# New → Blueprint, pick this repository, and Render creates everything below.
# Values marked `sync: false` are secrets: Render asks you to type them in; they are never in git.
services:
  - type: web
    name: vitaltrack
    runtime: docker
    plan: free
    region: singapore                # same region as the TiDB database (ap-southeast-1) = fast queries
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health      # Render only switches traffic to a new deploy once this answers 200
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUN_WORKER                # free plan has no background workers → run it inside the web service
        value: "true"
      - key: REDIS_URL
        fromService:                   # filled in automatically from the Key Value instance below
          type: keyvalue
          name: vitaltrack-redis
          property: connectionString
      # TiDB Cloud connection – the same values as in your server/.env (TiDB → Connect)
      - key: MYSQL_HOST                # e.g. gateway01.us-west-2.prod.aws.tidbcloud.com
        sync: false
      - key: MYSQL_USER                # the FULL user incl. prefix, e.g. 3xAbCdEf123.root
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_PORT
        value: "4000"
      - key: MYSQL_DATABASE
        value: vitaltrack
      - key: MYSQL_SSL                 # TiDB only accepts encrypted connections
        value: "true"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false

  - type: keyvalue                     # Render's managed Redis-compatible store (free: 25 MB)
    name: vitaltrack-redis
    plan: free
    region: singapore                # must be in the same region as the web service
    maxmemoryPolicy: noeviction        # BullMQ needs this: never silently drop queue data when full
    ipAllowList: []                    # empty = reachable only from inside Render, not the internet
